name: Go

on:
  # This job checks out, builds and tests, which a documentation or ansible
  # change gives no reason to do. Anything the build or the tests actually
  # read is listed; the embedded assets come along with their directories.
  push:
    branches: [ main ]
    paths:
      - 'cork/**'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - 'ci/**'
      # The seccomp tests read examples/seccomp and examples/execstack off
      # disk and fail when either has drifted from the embedded profile, so a
      # change there is a change this job has to see.
      - 'examples/**'
      - '.github/workflows/go.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'cork/**'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - 'ci/**'
      # The seccomp tests read examples/seccomp and examples/execstack off
      # disk and fail when either has drifted from the embedded profile, so a
      # change there is a change this job has to see.
      - 'examples/**'
      - '.github/workflows/go.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CORK_LOGGING: debug

jobs:
  build:
    name: Build (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    # The go.mod directive stays at the version the module requires; 1.27 is
    # here for early warning only -- CGO (mattn/go-sqlite3) and the vet checks
    # `go test` gained are where a Go minor usually bites, and both are worth
    # hearing about before anyone depends on them. A 1.27 job that fails is a
    # thing to look at, not a thing that blocks a merge, so it is advisory
    # until the directive moves to match.
    continue-on-error: ${{ matrix.go == '1.27.x' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest # linux/amd64
          - ubuntu-24.04-arm # linux/arm64, the other architecture released
        go:
          - '1.26.x' # what go.mod requires
          - '1.27.x' # advisory; see continue-on-error above

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # ci/version.sh needs tags, and needs enough history to count the
        # distance from one. The default shallow checkout has neither, so
        # `git describe --tags` fell through to a bare commit id and every
        # binary CI produced was stamped with that instead of a version.
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: ${{ matrix.go }}
        cache: true
      id: go

    - name: Get dependencies
      run: go mod download

    - name: Golang linting
      run: go vet ./...

    - name: Build
      run: |
        mkdir -p bin
        # Assigned on its own line so a failure in version.sh fails the job.
        # Substituted inline into `go build`, a non-zero exit is swallowed and
        # the step quietly produces, and tests, an unstamped binary.
        LDFLAGS=$(sh ci/version.sh --ldflags)
        echo "building $(sh ci/version.sh)"
        go build -v -ldflags "$LDFLAGS" -o bin/ ./cmd/...

    # Raising the go.mod directive above every go-version here would make the
    # toolchain switch to a golang.org/toolchain module, which ships no
    # covdata -- and coverage then fails on any package without a test file.
    # Move the directive and this matrix together.
    - name: Unit Tests
      run: go test -v -count=1 -race -coverprofile=coverage.out ./...

    - name: Display Coverage
      run: go tool cover -func=coverage.out

  # Every example challenge, built and delivered by a corkd and solved by its
  # own solver. One architecture: this checks the challenge corpus and the
  # build path, not the toolchain.
  examples:
    name: Examples (build, deliver, solve)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The engine production runs, not the runner's own, which lags it: cork
      # builds with no client session, and before 29.6.0 such a build cannot
      # pull its base image (moby/moby#48112). Keep this in step with prod.
      DOCKER_ENGINE: 29.10.0

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0 # ci/version.sh describes from a tag

    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: '1.26.x'
        cache: true

    - name: Build
      run: |
        mkdir -p bin
        LDFLAGS=$(sh ci/version.sh --ldflags)
        go build -ldflags "$LDFLAGS" -o bin/ ./cmd/corkd ./cmd/cork

    # With overlay2, as production's daemons are configured (BUILDER.md).
    - name: Start the docker engine production runs
      run: |
        docker run -d --privileged --name engine -e DOCKER_TLS_CERTDIR= \
          -p 127.0.0.1:2375:2375 "docker:${DOCKER_ENGINE}-dind" \
          dockerd --host=tcp://0.0.0.0:2375 --storage-driver=overlay2
        for _ in $(seq 60); do
          docker -H tcp://127.0.0.1:2375 version >/dev/null 2>&1 && break
          sleep 1
        done
        docker -H tcp://127.0.0.1:2375 info --format '{{.ServerVersion}} {{.Driver}}'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # The disks example builds FROM this image, which no registry holds. Cached
    # across runs, so its libguestfs and kernel install only re-runs when the
    # Dockerfile changes; built on the runner's daemon, then handed over.
    - name: Build the shared example base image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ci
        file: ci/guestfish-base.Dockerfile
        tags: cmgr/examples-guestfish-base:latest
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Hand the base image to the engine
      run: docker save cmgr/examples-guestfish-base:latest | docker -H tcp://127.0.0.1:2375 load

    - name: Build, deliver and solve every example
      env:
        DOCKER_HOST: tcp://127.0.0.1:2375
      run: bash ci/examples/run.sh bin
